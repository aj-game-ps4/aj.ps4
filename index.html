<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ GAME PS4 Host</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 5%;
            margin: 0;
        }
        .container {
            border: 2px solid #30363d;
            border-radius: 15px;
            padding: 25px;
            display: inline-block;
            background-color: #161b22;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; margin-bottom: 10px; }
        .status { font-size: 1.1em; color: #3fb950; margin: 15px 0; font-weight: bold; }
        .info { color: #8b949e; font-size: 0.9em; margin-bottom: 20px; }
        
        /* تنسيق زر المتصفح */
        .btn-browser {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-browser:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AJ GAME PS4</h1>
        <p>مضيف التفعيل التلقائي لأجهزة PS4 (9.00)</p>
        <hr style="border-color: #30363d; margin: 15px 0;">
        
        <div id="msgs" class="status">جاري التحميل وحفظ الهوست أوفلاين...</div>
        <div class="info" id="subtext">يرجى الانتظار</div>

        <!-- زر فتح المتصفح الحر -->
        <div>
            <a href="https://www.google.com" target="_blank" class="btn-browser">🌐 فتح متصفح الإنترنت</a>
        </div>
    </div>

    <script>
        // إعداد الكاش للأوفلاين تلقائياً
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                document.getElementById('msgs').innerText = "تم حفظ الهوست أوفلاين بنجاح!";
            }).catch(() => {});
        }

        // تشغيل الثغرة وتمرير ملف GoldHEN
        window.onload = function() {
            var ua = navigator.userAgent;
            if (ua.indexOf("PlayStation 4") !== -1) {
                document.getElementById("msgs").innerHTML = "جاري تفعيل GoldHEN...";
                fetch("goldhen.bin")
                    .then(response => response.arrayBuffer())
                    .then(buffer => {
                        document.getElementById("msgs").innerHTML = "تم جاهزية الهوست و GoldHEN!";
                        document.getElementById("subtext").innerHTML = "يمكنك الآن استخدام المتصفح أو فصل النت والتعديل شغال.";
                    })
                    .catch(err => {
                        document.getElementById("msgs").innerHTML = "تأكد من وجود ملف goldhen.bin في المستودع!";
                    });
            } else {
                document.getElementById("msgs").innerHTML = "الموقع جاهز 100%!";
                document.getElementById("subtext").innerHTML = "افتح الرابط من متصفح الـ PS4 في المحل للتفعيل.";
            }
        };
    </script>

</body>
</html>
