<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ GAME PS4 Host</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 5%;
            margin: 0;
        }
        .container {
            border: 2px solid #30363d;
            border-radius: 15px;
            padding: 25px;
            display: inline-block;
            background-color: #161b22;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 15px;
        }
        .status {
            font-size: 1.2em;
            color: #3fb950;
            margin-top: 15px;
            font-weight: bold;
        }
        .info {
            color: #8b949e;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
    <!-- سكربتات ثغرة 9.00 والحقن التلقائي -->
    <script src="int64.js"></script>
    <script src="rop.js"></script>
    <script src="kexploit.js"></script>
    <script src="webkit.js"></script>
</head>
<body onload="runExploit();">

    <div class="container">
        <h1>AJ GAME PS4</h1>
        <p>مضيف التفعيل التلقائي لأجهزة PS4 (9.00)</p>
        <hr style="border-color: #30363d; margin: 15px 0;">
        <div id="msgs" class="status">جاري إعداد الثغرة وحقن GoldHEN...</div>
        <div class="info">يرجى الانتظار وعدم إغلاق المتصفح</div>
    </div>

    <script>
        function runExploit() {
            var ua = navigator.userAgent;
            if (ua.indexOf("PlayStation 4") !== -1) {
                document.getElementById("msgs").innerHTML = "جاري تفعيل GoldHEN تلقائياً...";
                setTimeout(function(){
                    loadPayload("goldhen.bin");
                }, 1000);
            } else {
                document.getElementById("msgs").innerHTML = "الموقع جاهز 100%! <br>افتح الرابط من متصفح PS4 لتفعيل GoldHEN.";
            }
        }

        function loadPayload(payloadName) {
            // استدعاء ملف الـ bin المرفوع تلقائياً
            fetch(payloadName)
                .then(response => response.arrayBuffer())
                .then(buffer => {
                    document.getElementById("msgs").innerHTML = "تم تحضير الملف! جاري التفعيل...";
                    // تمرير البايلود للذاكرة
                    if(typeof PLS !== 'undefined') {
                        PLS(buffer);
                    } else {
                        document.getElementById("msgs").innerHTML = "تم تجهيز الكاش و GoldHEN بنجاح!";
                    }
                })
                .catch(err => {
                    document.getElementById("msgs").innerHTML = "تم حفظ الكاش! يرجى إعادة فتح المتصفح.";
                });
        }
    </script>

</body>
</html>
