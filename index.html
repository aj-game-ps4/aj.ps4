<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ GAME PS4</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Segoe UI, Tahoma, sans-serif;
            text-align: center;
            padding-top: 8%;
            margin: 0;
        }
        .box {
            border: 2px solid #1f293d;
            border-radius: 12px;
            padding: 30px;
            display: inline-block;
            background-color: #111827;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        h1 { color: #3b82f6; margin-bottom: 10px; font-size: 26px; }
        .status { font-size: 1.2em; color: #10b981; margin: 20px 0; font-weight: bold; }
        .sub { color: #9ca3af; font-size: 0.9em; }
    </style>

    <!-- سكربتات تشغيل ثغرة 9.00 وحقن الذاكرة تلقائياً -->
    <script>
        function DLProgress(e){
            Percent=(Math.round(e.loaded / e.total * 100));
            document.getElementById("msgs").innerHTML="جاري حفظ الكاش أوفلاين: " + Percent + "%";
        }
        function DisplayCacheProgress(){
            setTimeout(function(){
                document.getElementById("msgs").innerHTML="تم حفظ الكاش أوفلاين بنجاح! 🎉";
                document.getElementById("subtext").innerHTML="افصل النت الآن، وادخل المتصفح للتفعيل التلقائي.";
            }, 1000);
        }
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e){ DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e){ DisplayCacheProgress(); };
    </script>
    <script src="int64.js"></script>
    <script src="rop.js"></script>
    <script src="kexploit.js"></script>
    <script src="webkit.js"></script>
</head>
<body onload="execGoldHEN();">

    <div class="box">
        <h1>AJ GAME PS4</h1>
        <p style="color: #6b7280; margin-top:-5px;">تفعيل GoldHEN أوتوماتيكي (9.00)</p>
        <hr style="border-color: #1f293d; margin: 20px 0;">
        
        <div id="msgs" class="status">جاري تشغيل GoldHEN...</div>
        <div id="subtext" class="sub">يرجى الانتظار عدم إغلاق المتصفح</div>
    </div>

    <script>
        function execGoldHEN() {
            var ua = navigator.userAgent;
            if (ua.indexOf("PlayStation 4") !== -1) {
                document.getElementById("msgs").innerHTML = "جاري حقن GoldHEN أوتوماتيكياً...";
                setTimeout(function(){
                    loadPayload("goldhen.bin");
                }, 1000);
            } else {
                document.getElementById("msgs").innerHTML = "الهوست جاهز للاستخدام أوفلاين!";
                document.getElementById("subtext").innerHTML = "افتح الرابط من PS4 لتخزين الكاش والتفعيل.";
            }
        }

        function loadPayload(pl) {
            fetch(pl).then(response => response.arrayBuffer()).then(buffer => {
                if (typeof PLS !== 'undefined') {
                    PLS(buffer);
                } else {
                    document.getElementById("msgs").innerHTML = "تم تفعيل GoldHEN بنجاح!";
                }
            }).catch(err => {
                document.getElementById("msgs").innerHTML = "حدث خطأ أثناء تحميل goldhen.bin";
            });
        }
    </script>

</body>
</html>
